name: Test Toolchain

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.name }}
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows PowerShell 7
            os: windows-2022
            shell: pwsh
            coverage: 80
            log: windows-pwsh-test.log
          - name: Windows PowerShell 5.1
            os: windows-2022
            shell: powershell
            coverage: 80
            log: windows-powershell51-test.log
          - name: Linux PowerShell 7
            os: ubuntu-22.04
            shell: pwsh
            coverage: 0
            log: linux-pwsh-test.log
          - name: macOS PowerShell 7
            os: macos-15
            shell: pwsh
            coverage: 0
            log: macos-pwsh-test.log
    env:
      TOOLCHAIN_COVERAGE_TARGET: ${{ matrix.coverage }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache PowerShell modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ps_modules
          key: psmodules-${{ runner.os }}-${{ matrix.shell }}-${{ hashFiles('test.ps1', 'test.dependencies.psd1') }}

      - name: Create temporary signing certificate
        if: runner.os == 'Windows' && matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Toolchain CI' -CertStoreLocation Cert:\CurrentUser\My
          "TOOLCHAIN_MANIFEST_SIGN_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create temporary signing certificate (Windows PowerShell 5.1)
        if: runner.os == 'Windows' && matrix.shell == 'powershell'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Toolchain CI' -CertStoreLocation Cert:\CurrentUser\My
          "TOOLCHAIN_MANIFEST_SIGN_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run complete test suite (PowerShell 7 on Windows)
        if: matrix.shell == 'pwsh' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          if ([enum]::GetNames([Net.SecurityProtocolType]) -contains 'Tls13') {
            [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls13
          }

          Set-Alias -Name WriteHost -Value Write-Host -Scope Global -Force
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          .\test.ps1 *>&1 | Tee-Object -FilePath (Join-Path artifacts '${{ matrix.log }}')

      - name: Run cross-platform client suite (PowerShell 7 on Linux and macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $paths = @(
            '.\src\definition.Tests.ps1'
            '.\src\http.Tests.ps1'
            '.\src\tar.Tests.ps1'
            '.\src\registry.Tests.ps1'
            '.\src\registry-transport.Tests.ps1'
            '.\src\registry-credentials.Tests.ps1'
            '.\src\project.Tests.ps1'
            '.\src\environment.Tests.ps1'
            '.\src\shell.Tests.ps1'
            '.\build.Tests.ps1'
          )
          .\test.ps1 -Paths $paths *>&1 | Tee-Object -FilePath (Join-Path artifacts '${{ matrix.log }}')

      - name: Run complete test suite (Windows PowerShell 5.1)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Set-Alias -Name WriteHost -Value Write-Host -Scope Global -Force
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          .\test.ps1 *>&1 | Tee-Object -FilePath (Join-Path artifacts '${{ matrix.log }}')

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}-log
          path: artifacts/${{ matrix.log }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage to Codecov
        if: matrix.shell == 'pwsh' && runner.os == 'Windows' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: ./coverage.xml
          # The test suite enforces the coverage threshold. Keep the external
          # upload best-effort until this repository is onboarded in Codecov.
          fail_ci_if_error: false
          use_oidc: true

  registry-integration:
    name: Authenticated OCI registry integration
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start authenticated local registry
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path .registry-auth -Force | Out-Null
          [IO.File]::WriteAllText('.registry-auth/htpasswd', 'integration:$2b$10$4pIR69tlif14QBS8ONfMk.an1oZ4vo/o3bPmMoeG4fT5f0bCpGFh6')
          $authDirectory = (Resolve-Path .registry-auth).Path
          docker run --detach --name toolchain-auth-registry --publish 5000:5000 `
            --mount "type=bind,source=$authDirectory,target=/auth,readonly" `
            --env REGISTRY_AUTH=htpasswd `
            --env REGISTRY_AUTH_HTPASSWD_REALM='Toolchain integration registry' `
            --env REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd `
          registry:2@sha256:46faa9a1ae6813194b53921a370f2f4f8c5e1aae228a89bceafef5847a6a3278
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            try {
              $response = Invoke-WebRequest -Uri http://localhost:5000/v2/ -SkipHttpErrorCheck
              if ([int]$response.StatusCode -eq 401) { break }
            }
            catch {
              if ($attempt -eq 30) { throw }
            }
            if ($attempt -eq 30) { throw 'Authenticated registry did not become ready or failed open.' }
            Start-Sleep -Seconds 1
          }

      - name: Publish fixture image with registry credentials
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          'integration-password' | docker login localhost:5000 --username integration --password-stdin
          if ($LASTEXITCODE -ne 0) { throw 'Authenticated registry login failed.' }
          New-Item -ItemType Directory -Path .registry-fixture -Force | Out-Null
          [IO.File]::WriteAllText('.registry-fixture/.tlc', '{"env":{"PATH":"${.}/bin"}}')
          [IO.File]::WriteAllText('.registry-fixture/Dockerfile', @'
          FROM scratch
          COPY .tlc /.tlc
          '@)
          docker build -t localhost:5000/acme/toolchains:demo-1.0.0 .registry-fixture
          docker push localhost:5000/acme/toolchains:demo-1.0.0

      - name: Deny anonymous access and exercise authenticated Registry V2 requests
        shell: pwsh
        env:
          TOOLCHAIN_REGISTRY: http://localhost:5000
          TOOLCHAIN_INDEX_REGISTRY: http://localhost:5000
          TOOLCHAIN_REPOSITORY: acme/toolchains
          TOOLCHAIN_CATALOG_CACHE_TTL: 00:00:00
          TOOLCHAIN_USERNAME: integration
          TOOLCHAIN_PASSWORD: integration-password
          TOOLCHAIN_AUTH_FILE: .registry-auth/empty-config.json
        run: |
          $ErrorActionPreference = 'Stop'
          [IO.File]::WriteAllText('.registry-auth/empty-config.json', '{"auths":{}}')
          . .\src\registry.ps1
          $username = $env:TOOLCHAIN_USERNAME
          $password = $env:TOOLCHAIN_PASSWORD
          $env:TOOLCHAIN_USERNAME = $null
          $env:TOOLCHAIN_PASSWORD = $null
          $anonymousDenied = $false
          try { GetTagsList -Refresh | Out-Null } catch { $anonymousDenied = "$_" -match 'HTTP 401|requires Basic auth' }
          if (-not $anonymousDenied) { throw 'Anonymous registry access was not denied.' }
          $env:TOOLCHAIN_USERNAME = $username
          $env:TOOLCHAIN_PASSWORD = $password
          $script:RegistryAuthHeaderCache = @{}
          $catalog = GetTagsList -Refresh
          if ('demo-1.0.0' -notin @($catalog.Tags)) { throw 'Local registry tag discovery failed.' }
          $manifest = GetManifestJson -Ref 'demo-1.0.0'
          if ([int]$manifest.schemaVersion -ne 2) { throw 'Local registry manifest retrieval failed.' }

  agent:
    name: Toolchain agent
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache: false

      - name: Test admission and registry gateway
        working-directory: agent
        run: go test ./...

      - name: Build minimal agent image
        run: docker build --tag toolchain-agent:test ./agent
