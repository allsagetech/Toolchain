name: Release Toolchain

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows PowerShell 7
            os: windows-2022
            shell: pwsh
            coverage: 60
          - name: Windows PowerShell 5.1
            os: windows-2022
            shell: powershell
            coverage: 60
          - name: Linux PowerShell 7
            os: ubuntu-22.04
            shell: pwsh
            coverage: 0
    env:
      TOOLCHAIN_COVERAGE_TARGET: ${{ matrix.coverage }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache PowerShell modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ps_modules
          key: release-psmodules-${{ runner.os }}-${{ matrix.shell }}-${{ hashFiles('test.ps1') }}

      - name: Create temporary signing certificate
        if: runner.os == 'Windows' && matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Toolchain Release CI' -CertStoreLocation Cert:\CurrentUser\My
          "TOOLCHAIN_MANIFEST_SIGN_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create temporary signing certificate (Windows PowerShell 5.1)
        if: runner.os == 'Windows' && matrix.shell == 'powershell'
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Toolchain Release CI' -CertStoreLocation Cert:\CurrentUser\My
          "TOOLCHAIN_MANIFEST_SIGN_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run complete test suite (PowerShell 7 on Windows)
        if: matrix.shell == 'pwsh' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          .\test.ps1

      - name: Run cross-platform registry and archive suite (PowerShell 7 on Linux)
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $paths = @(
            '.\src\definition.Tests.ps1'
            '.\src\http.Tests.ps1'
            '.\src\tar.Tests.ps1'
            '.\src\registry.Tests.ps1'
          )
          .\test.ps1 -Paths $paths

      - name: Run complete test suite (Windows PowerShell 5.1)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          .\test.ps1

  release:
    name: Publish signed release
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment: toolchain-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify tag matches module version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          $moduleVersion = (Get-Content -LiteralPath .\VERSION -Raw).Trim()
          if ($tagVersion -ne $moduleVersion) {
            throw "Tag version '$tagVersion' does not match VERSION '$moduleVersion'."
          }

      - name: Build release archive and checksums
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\build.ps1
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $archive = "dist/Toolchain-$($env:GITHUB_REF_NAME).zip"
          Compress-Archive -Path .\build\Toolchain\* -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($archive))" | Set-Content -LiteralPath dist\SHA256SUMS -Encoding ascii
          "archive=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Export canonical package specification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\export-package-spec.ps1 -OutputDirectory .\dist

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: build/Toolchain
          format: spdx-json
          output-file: dist/Toolchain-${{ github.ref_name }}.spdx.json
          syft-version: v1.51.0
          upload-artifact: false
          upload-release-assets: false

      - name: Attest release provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - name: Attest package specification provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/toolchain-package-spec-v1.zip

      - name: Attest release SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ steps.package.outputs.archive }}
          sbom-path: dist/Toolchain-${{ github.ref_name }}.spdx.json

      - name: Publish immutable GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            "dist/Toolchain-$GITHUB_REF_NAME.zip" \
            "dist/Toolchain-$GITHUB_REF_NAME.spdx.json" \
            "dist/toolchain-package-spec-v1.zip" \
            "dist/toolchain-package-spec-v1.zip.sha256" \
            "dist/SHA256SUMS"

      - name: Publish matching PowerShell Gallery package
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:PSGALLERY_API_KEY)) {
            Write-Output '::warning title=PowerShell Gallery publish skipped::Configure PSGALLERY_API_KEY in the toolchain-release environment to publish this exact release to PowerShell Gallery.'
            return
          }
          Publish-Module -Path .\build\Toolchain -Repository PSGallery -NuGetApiKey $env:PSGALLERY_API_KEY -Force
