name: Release Toolchain

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows PowerShell 7
            os: windows-2022
            shell: pwsh
            coverage: 60
          - name: Windows PowerShell 5.1
            os: windows-2022
            shell: powershell
            coverage: 60
          - name: Linux PowerShell 7
            os: ubuntu-22.04
            shell: pwsh
            coverage: 0
    env:
      TOOLCHAIN_COVERAGE_TARGET: ${{ matrix.coverage }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Cache PowerShell modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ps_modules
          key: release-psmodules-${{ runner.os }}-${{ matrix.shell }}-${{ hashFiles('test.ps1') }}

      - name: Create temporary signing certificate
        if: runner.os == 'Windows' && matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Toolchain Release CI' -CertStoreLocation Cert:\CurrentUser\My
          "TOOLCHAIN_MANIFEST_SIGN_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create temporary signing certificate (Windows PowerShell 5.1)
        if: runner.os == 'Windows' && matrix.shell == 'powershell'
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Toolchain Release CI' -CertStoreLocation Cert:\CurrentUser\My
          "TOOLCHAIN_MANIFEST_SIGN_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run complete test suite (PowerShell 7 on Windows)
        if: matrix.shell == 'pwsh' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          .\test.ps1

      - name: Run explicit cross-platform suite (PowerShell 7 on Linux)
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $paths = @(
            '.\src\definition.Tests.ps1'
            '.\src\http.Tests.ps1'
            '.\src\tar.Tests.ps1'
            '.\src\registry.Tests.ps1'
          )
          .\test.ps1 -Paths $paths

      - name: Run complete test suite (Windows PowerShell 5.1)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          .\test.ps1

  release:
    name: Publish signed release
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment: toolchain-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Verify tag matches module version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          $moduleVersion = (Get-Content -LiteralPath .\VERSION -Raw).Trim()
          if ($tagVersion -ne $moduleVersion) {
            throw "Tag version '$tagVersion' does not match VERSION '$moduleVersion'."
          }

      - name: Build release archive and checksums
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\build.ps1
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $archive = "dist/Toolchain-$($env:GITHUB_REF_NAME).zip"
          Compress-Archive -Path .\build\Toolchain\* -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($archive))" | Set-Content -LiteralPath dist\SHA256SUMS -Encoding ascii
          "archive=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Export canonical package specification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\export-package-spec.ps1 -OutputDirectory .\dist

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: build/Toolchain
          format: spdx-json
          output-file: dist/Toolchain-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest release provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - name: Attest package specification provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/toolchain-package-spec-v1.zip

      - name: Attest release SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-path: ${{ steps.package.outputs.archive }}
          sbom-path: dist/Toolchain-${{ github.ref_name }}.spdx.json

      - name: Publish immutable GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            "dist/Toolchain-$GITHUB_REF_NAME.zip" \
            "dist/Toolchain-$GITHUB_REF_NAME.spdx.json" \
            "dist/toolchain-package-spec-v1.zip" \
            "dist/toolchain-package-spec-v1.zip.sha256" \
            "dist/SHA256SUMS"
