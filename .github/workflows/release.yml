name: Release Toolchain

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows PowerShell 7
            os: windows-2022
            shell: pwsh
            coverage: 80
          - name: Windows PowerShell 5.1
            os: windows-2022
            shell: powershell
            coverage: 80
          - name: Linux PowerShell 7
            os: ubuntu-22.04
            shell: pwsh
            coverage: 0
          - name: macOS PowerShell 7
            os: macos-15
            shell: pwsh
            coverage: 0
    env:
      TOOLCHAIN_COVERAGE_TARGET: ${{ matrix.coverage }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache PowerShell modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ps_modules
          key: release-psmodules-${{ runner.os }}-${{ matrix.shell }}-${{ hashFiles('test.ps1', 'test.dependencies.psd1') }}

      - name: Create temporary signing certificate
        if: runner.os == 'Windows' && matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Toolchain Release CI' -CertStoreLocation Cert:\CurrentUser\My
          "TOOLCHAIN_MANIFEST_SIGN_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create temporary signing certificate (Windows PowerShell 5.1)
        if: runner.os == 'Windows' && matrix.shell == 'powershell'
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Toolchain Release CI' -CertStoreLocation Cert:\CurrentUser\My
          "TOOLCHAIN_MANIFEST_SIGN_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run complete test suite (PowerShell 7 on Windows)
        if: matrix.shell == 'pwsh' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          .\test.ps1

      - name: Run cross-platform client suite (PowerShell 7 on Linux and macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $paths = @(
            '.\src\definition.Tests.ps1'
            '.\src\http.Tests.ps1'
            '.\src\tar.Tests.ps1'
            '.\src\registry.Tests.ps1'
            '.\src\registry-transport.Tests.ps1'
            '.\src\registry-credentials.Tests.ps1'
            '.\src\project.Tests.ps1'
            '.\src\environment.Tests.ps1'
            '.\src\shell.Tests.ps1'
            '.\build.Tests.ps1'
          )
          .\test.ps1 -Paths $paths

      - name: Run complete test suite (Windows PowerShell 5.1)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          .\test.ps1

  agent:
    name: Validate Toolchain agent
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache: false

      - name: Test admission and registry gateway
        working-directory: agent
        run: go test ./...

      - name: Build minimal agent image
        run: docker build --tag toolchain-agent:test ./agent

  release:
    name: Publish signed release
    needs: [validate, agent]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment: toolchain-release
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify tag matches module version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          $moduleVersion = (Get-Content -LiteralPath .\VERSION -Raw).Trim()
          if ($tagVersion -ne $moduleVersion) {
            throw "Tag version '$tagVersion' does not match VERSION '$moduleVersion'."
          }
          "AGENT_IMAGE=ghcr.io/allsagetech/toolchain-agent:$tagVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Refuse to overwrite an existing agent release
        shell: bash
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$AGENT_IMAGE" >/dev/null 2>&1; then
            echo "::error title=Immutable agent tag already exists::$AGENT_IMAGE cannot be overwritten."
            exit 1
          fi

      - name: Build and publish multi-architecture Toolchain agent
        id: agent-build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ./agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.AGENT_IMAGE }}
          provenance: mode=max
          sbom: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the immutable Toolchain agent digest
        shell: bash
        env:
          AGENT_DIGEST: ${{ steps.agent-build.outputs.digest }}
        run: cosign sign --yes "$AGENT_IMAGE@$AGENT_DIGEST"

      - name: Build release archive and checksums
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\build.ps1
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $archive = "dist/Toolchain-$($env:GITHUB_REF_NAME).zip"
          Compress-Archive -Path .\build\Toolchain\* -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($archive))" | Set-Content -LiteralPath dist\SHA256SUMS -Encoding ascii
          "archive=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Export canonical package specification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\export-package-spec.ps1 -OutputDirectory .\dist

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: build/Toolchain
          format: spdx-json
          output-file: dist/Toolchain-${{ github.ref_name }}.spdx.json
          syft-version: v1.51.0
          upload-artifact: false
          upload-release-assets: false

      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - name: Attest package specification provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/toolchain-package-spec-v1.zip

      - name: Attest release SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.archive }}
          sbom-path: dist/Toolchain-${{ github.ref_name }}.spdx.json

      - name: Stage and publish immutable GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --generate-notes \
            "dist/Toolchain-$GITHUB_REF_NAME.zip" \
            "dist/Toolchain-$GITHUB_REF_NAME.spdx.json" \
            "dist/toolchain-package-spec-v1.zip" \
            "dist/toolchain-package-spec-v1.zip.sha256" \
            "dist/SHA256SUMS"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
          immutable="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isImmutable --jq .isImmutable)"
          if [[ "$immutable" != "true" ]]; then
            gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes
            echo "::error title=Release immutability is not enforced::Enable release immutability in repository settings before publishing another release."
            exit 1
          fi

      - name: Request Toolchains consumer promotion
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.TOOLCHAINS_PROMOTION_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            Write-Output '::warning title=Toolchains promotion dispatch skipped::Configure TOOLCHAINS_PROMOTION_TOKEN in the toolchain-release environment; the scheduled promotion workflow remains a fallback.'
            return
          }
          $payload = @{
            event_type = 'toolchain-released'
            client_payload = @{
              ref = $env:GITHUB_SHA
              version = $env:GITHUB_REF_NAME.TrimStart('v')
              tag = $env:GITHUB_REF_NAME
            }
          } | ConvertTo-Json -Depth 5 -Compress
          $payload | gh api repos/allsagetech/Toolchains/dispatches --method POST --input -
          if ($LASTEXITCODE -ne 0) { throw 'Could not dispatch Toolchains consumer promotion.' }

      - name: Publish matching PowerShell Gallery package
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:PSGALLERY_API_KEY)) {
            Write-Output '::warning title=PowerShell Gallery publish skipped::Configure PSGALLERY_API_KEY in the toolchain-release environment to publish this exact release to PowerShell Gallery.'
            return
          }
          Publish-Module -Path .\build\Toolchain -Repository PSGallery -NuGetApiKey $env:PSGALLERY_API_KEY -Force
