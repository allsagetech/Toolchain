name: Contract Test (Toolchains)

on:
  repository_dispatch:
    types: [toolchains-built]
  workflow_dispatch:
    inputs:
      docker_repo:
        description: Registry repository containing the package
        required: true
        type: string
      package_name:
        description: Toolchain package name
        required: true
        type: string
      package_version:
        description: Toolchain package semantic version
        required: true
        type: string
      digest:
        description: Published sha256 manifest digest
        required: true
        type: string
      repo_digest_ref:
        description: Fully qualified repository@sha256 reference
        required: true
        type: string
      spec_version:
        description: Toolchain image contract version
        required: true
        default: '1'
        type: string
      tlc_path:
        description: Definition path in the image
        required: true
        default: '/.tlc'
        type: string
      tlc_sha256:
        description: Expected definition SHA-256
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.client_payload.repoDigestRef || inputs.repo_digest_ref || github.run_id }}
  cancel-in-progress: false

jobs:
  contract:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows PowerShell 7
            os: windows-2022
            shell: pwsh
            coverage: 80
          - name: Windows PowerShell 5.1
            os: windows-2022
            shell: powershell
            coverage: 80
          - name: Linux PowerShell 7
            os: ubuntu-22.04
            shell: pwsh
            coverage: 0
    env:
      TOOLCHAIN_COVERAGE_TARGET: ${{ matrix.coverage }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load and validate contract payload (PowerShell 7)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        env:
          DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          INPUT_DOCKER_REPO: ${{ inputs.docker_repo }}
          INPUT_PACKAGE_NAME: ${{ inputs.package_name }}
          INPUT_PACKAGE_VERSION: ${{ inputs.package_version }}
          INPUT_DIGEST: ${{ inputs.digest }}
          INPUT_REPO_DIGEST_REF: ${{ inputs.repo_digest_ref }}
          INPUT_SPEC_VERSION: ${{ inputs.spec_version }}
          INPUT_TLC_PATH: ${{ inputs.tlc_path }}
          INPUT_TLC_SHA256: ${{ inputs.tlc_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:GITHUB_EVENT_NAME -eq 'repository_dispatch') {
            if (-not $env:DISPATCH_PAYLOAD -or $env:DISPATCH_PAYLOAD -eq 'null') {
              throw 'repository_dispatch did not contain client_payload.'
            }
            $payload = $env:DISPATCH_PAYLOAD | ConvertFrom-Json
          } else {
            $payload = [pscustomobject]@{
              dockerRepo = $env:INPUT_DOCKER_REPO
              packageName = $env:INPUT_PACKAGE_NAME
              packageVersion = $env:INPUT_PACKAGE_VERSION
              digest = $env:INPUT_DIGEST
              repoDigestRef = $env:INPUT_REPO_DIGEST_REF
              specVersion = $env:INPUT_SPEC_VERSION
              tlcPath = $env:INPUT_TLC_PATH
              tlcSha256 = $env:INPUT_TLC_SHA256
            }
          }

          foreach ($required in @('dockerRepo','packageName','packageVersion','digest','repoDigestRef','specVersion','tlcPath','tlcSha256')) {
            if ([string]::IsNullOrWhiteSpace([string]$payload.$required)) {
              throw "Contract payload is missing required field '$required'."
            }
          }

          $digest = [string]$payload.digest
          if (-not $digest.StartsWith('sha256:')) { $digest = "sha256:$digest" }
          if ($digest -notmatch '^sha256:[0-9a-fA-F]{64}$') { throw "Invalid digest: $digest" }
          if ([string]$payload.repoDigestRef -notmatch "@$([regex]::Escape($digest))$") {
            throw 'repoDigestRef does not end in the supplied digest.'
          }
          if ([string]$payload.specVersion -ne '1') { throw "Unsupported contract specVersion: $($payload.specVersion)" }
          if ([string]$payload.tlcSha256 -notmatch '^[0-9a-fA-F]{64}$') { throw 'tlcSha256 must be a SHA-256 hex digest.' }

          $values = @{
            TLC_CONTRACT_DOCKER_REPO = [string]$payload.dockerRepo
            TLC_CONTRACT_PACKAGE_NAME = [string]$payload.packageName
            TLC_CONTRACT_PACKAGE_VERSION = [string]$payload.packageVersion
            TLC_CONTRACT_DIGEST = $digest
            TLC_CONTRACT_REPO_DIGEST_REF = [string]$payload.repoDigestRef
            TLC_CONTRACT_SPEC_VERSION = [string]$payload.specVersion
            TLC_CONTRACT_TLC_PATH = [string]$payload.tlcPath
            TLC_CONTRACT_TLC_SHA256 = ([string]$payload.tlcSha256).ToLowerInvariant()
            TOOLCHAIN_REPOSITORY = [string]$payload.dockerRepo
          }
          foreach ($item in $values.GetEnumerator()) {
            "$($item.Key)=$($item.Value)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Load and validate contract payload (Windows PowerShell 5.1)
        if: matrix.shell == 'powershell'
        shell: powershell
        env:
          DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          INPUT_DOCKER_REPO: ${{ inputs.docker_repo }}
          INPUT_PACKAGE_NAME: ${{ inputs.package_name }}
          INPUT_PACKAGE_VERSION: ${{ inputs.package_version }}
          INPUT_DIGEST: ${{ inputs.digest }}
          INPUT_REPO_DIGEST_REF: ${{ inputs.repo_digest_ref }}
          INPUT_SPEC_VERSION: ${{ inputs.spec_version }}
          INPUT_TLC_PATH: ${{ inputs.tlc_path }}
          INPUT_TLC_SHA256: ${{ inputs.tlc_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:GITHUB_EVENT_NAME -eq 'repository_dispatch') {
            if (-not $env:DISPATCH_PAYLOAD -or $env:DISPATCH_PAYLOAD -eq 'null') {
              throw 'repository_dispatch did not contain client_payload.'
            }
            $payload = $env:DISPATCH_PAYLOAD | ConvertFrom-Json
          } else {
            $payload = [pscustomobject]@{
              dockerRepo = $env:INPUT_DOCKER_REPO
              packageName = $env:INPUT_PACKAGE_NAME
              packageVersion = $env:INPUT_PACKAGE_VERSION
              digest = $env:INPUT_DIGEST
              repoDigestRef = $env:INPUT_REPO_DIGEST_REF
              specVersion = $env:INPUT_SPEC_VERSION
              tlcPath = $env:INPUT_TLC_PATH
              tlcSha256 = $env:INPUT_TLC_SHA256
            }
          }

          foreach ($required in @('dockerRepo','packageName','packageVersion','digest','repoDigestRef','specVersion','tlcPath','tlcSha256')) {
            if ([string]::IsNullOrWhiteSpace([string]$payload.$required)) {
              throw "Contract payload is missing required field '$required'."
            }
          }

          $digest = [string]$payload.digest
          if (-not $digest.StartsWith('sha256:')) { $digest = "sha256:$digest" }
          if ($digest -notmatch '^sha256:[0-9a-fA-F]{64}$') { throw "Invalid digest: $digest" }
          if ([string]$payload.repoDigestRef -notmatch "@$([regex]::Escape($digest))$") {
            throw 'repoDigestRef does not end in the supplied digest.'
          }
          if ([string]$payload.specVersion -ne '1') { throw "Unsupported contract specVersion: $($payload.specVersion)" }
          if ([string]$payload.tlcSha256 -notmatch '^[0-9a-fA-F]{64}$') { throw 'tlcSha256 must be a SHA-256 hex digest.' }

          $values = @{
            TLC_CONTRACT_DOCKER_REPO = [string]$payload.dockerRepo
            TLC_CONTRACT_PACKAGE_NAME = [string]$payload.packageName
            TLC_CONTRACT_PACKAGE_VERSION = [string]$payload.packageVersion
            TLC_CONTRACT_DIGEST = $digest
            TLC_CONTRACT_REPO_DIGEST_REF = [string]$payload.repoDigestRef
            TLC_CONTRACT_SPEC_VERSION = [string]$payload.specVersion
            TLC_CONTRACT_TLC_PATH = [string]$payload.tlcPath
            TLC_CONTRACT_TLC_SHA256 = ([string]$payload.tlcSha256).ToLowerInvariant()
            TOOLCHAIN_REPOSITORY = [string]$payload.dockerRepo
          }
          foreach ($item in $values.GetEnumerator()) {
            "$($item.Key)=$($item.Value)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Run full unit and consumer contract tests (Windows PowerShell 7)
        if: runner.os == 'Windows' && matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          .\build.ps1
          .\test.ps1 -Paths .\src,.\contract

      - name: Run full unit and consumer contract tests (Windows PowerShell 5.1)
        if: runner.os == 'Windows' && matrix.shell == 'powershell'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          .\build.ps1
          .\test.ps1 -Paths .\src,.\contract

      - name: Run cross-platform unit and consumer contract tests (Linux)
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          .\build.ps1
          $paths = @(
            '.\src\definition.Tests.ps1'
            '.\src\http.Tests.ps1'
            '.\src\tar.Tests.ps1'
            '.\src\registry.Tests.ps1'
            '.\contract'
          )
          .\test.ps1 -Paths $paths
