name: Bug report
description: Report incorrect Toolchain behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the command, expected behavior, and complete error text.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Diagnostics
      description: Paste `toolchain doctor -Json` output with secrets removed.
      render: json
  - type: input
    id: version
    attributes:
      label: Toolchain and PowerShell versions
      placeholder: Toolchain 2.1.0; PowerShell 7.6
    validations:
      required: true
  - type: dropdown
    id: security
    attributes:
      label: Does this disclose a vulnerability?
      options: ["No", "Yes — I will use SECURITY.md instead"]
    validations:
      required: true
